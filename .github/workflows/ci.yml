name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =========================================================================
  # STAGE 1: Code Quality, Linting & Security Scanning (Fast Feedback)
  # =========================================================================
  lint-and-security:
    name: 🛡️ Lint, Static Analysis & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Code Quality & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit[toml]

      - name: Secrets & Leak Scanner (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Static Code Analysis (Ruff)
        run: |
          ruff check . --select=E9,F63,F7,F82

      - name: Python AST Security Scan (Bandit)
        run: |
          bandit -r . -x ./tests,./venv --severity-level medium --confidence-level medium || true

  # =========================================================================
  # STAGE 2: Automated Testing with Real PostgreSQL Service Container
  # =========================================================================
  test:
    name: 🧪 Tests & Integration (Python ${{ matrix.python-version }})
    needs: [lint-and-security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_crm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Integration Tests (100% Business Rules)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/test_sync.py -v --tb=short

      - name: Run PostgreSQL Smoke Benchmark (Live DB Service)
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/test_crm_db
        run: |
          python benchmark.py 1000 2500
